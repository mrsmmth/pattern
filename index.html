<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>pattern</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar hardware-panel">
      <i class="screw s1"></i><i class="screw s2"></i>
      <div class="brand-block">
        <div class="eyebrow">MIDI PATTERN ARCHIVE · PTN-01</div>
        <h1>pattern<span>.</span></h1>
      </div>
      <div class="studio-status" aria-hidden="true">
        <div><i></i><small>READY</small></div>
        <div><i class="amber"></i><small>LOCAL</small></div>
      </div>
      <label class="add-btn" for="midiInput" aria-label="MIDIを追加"><span>＋</span> LOAD MIDI</label>
      <input id="midiInput" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" multiple hidden />
    </header>

    <section class="toolbar hardware-panel" aria-label="表示設定">
      <div class="segmented" id="sortTabs">
        <button class="active" data-sort="recent">RECENT</button>
        <button data-sort="used">USED</button>
        <button data-sort="favorite">FAVORITE</button>
      </div>
      <div class="drop-inline" id="dropzone"><b>↓</b><span>DROP MIDI</span></div>
      <div class="count" id="patternCount">0 PATTERNS</div>
    </section>
    <section class="library-panel hardware-panel">
      <i class="screw s3"></i><i class="screw s4"></i>
      <section class="grid" id="patternGrid" aria-live="polite"></section>
      <section class="empty" id="emptyState">
        <div class="empty-roll" aria-hidden="true"><i style="--x:8%;--y:66%;--w:28%"></i><i style="--x:40%;--y:38%;--w:20%"></i><i style="--x:63%;--y:22%;--w:29%"></i><i style="--x:39%;--y:70%;--w:49%"></i></div>
        <h2>LOAD YOUR FIRST PATTERN</h2>
        <p>MIDIを落とすだけ。名前もフォルダも必要なし。</p>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-head">
        <div class="pattern-no"></div>
        <button class="favorite-btn" aria-label="お気に入り">☆</button>
      </div>
      <button class="visual-button" aria-label="プレビュー再生">
        <canvas class="roll"></canvas>
        <div class="playhead"></div>
        <div class="beat-strip"><span>1</span><span>2</span><span>3</span><span>4</span></div>
        <div class="play-pill">▶</div>
      </button>
      <div class="card-foot">
        <div class="meta"><span class="bars">4 BEATS</span><span class="uses">0 USES</span></div>
        <div class="actions">
          <button class="icon-action export-action" title="MIDIを書き出し">↓</button>
          <div class="drag-handle" draggable="true" role="button" tabindex="0">DRAG <b>→</b> LOGIC</div>
        </div>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
