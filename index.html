<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>pattern</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">MIDI BACKING LIBRARY</div>
        <h1>pattern<span>.</span></h1>
      </div>
      <label class="add-btn" for="midiInput" aria-label="MIDIを追加">
        <span>＋</span> ADD MIDI
      </label>
      <input id="midiInput" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" multiple hidden />
    </header>

    <section class="toolbar" aria-label="表示設定">
      <div class="segmented" id="sortTabs">
        <button class="active" data-sort="recent">RECENT</button>
        <button data-sort="used">USED</button>
        <button data-sort="favorite">FAVORITE</button>
      </div>
      <div class="count" id="patternCount">0 PATTERNS</div>
    </section>

    <section class="dropzone" id="dropzone">
      <div class="drop-mark">↘</div>
      <div>
        <strong>DROP MIDI HERE</strong>
        <small>名前も整理もいらない。入れた瞬間、棚に追加。</small>
      </div>
    </section>

    <section class="grid" id="patternGrid" aria-live="polite"></section>

    <section class="empty" id="emptyState">
      <div class="empty-roll" aria-hidden="true">
        <i style="--x:8%;--y:66%;--w:28%"></i><i style="--x:40%;--y:38%;--w:20%"></i>
        <i style="--x:63%;--y:22%;--w:29%"></i><i style="--x:39%;--y:70%;--w:49%"></i>
      </div>
      <h2>Your patterns start here.</h2>
      <p>Logicで作ったMIDIをひとつ落とせば、それが最初のストック。</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-head">
        <div class="pattern-no"></div>
        <button class="favorite-btn" aria-label="お気に入り">☆</button>
      </div>
      <button class="visual-button" aria-label="プレビュー再生">
        <canvas class="roll"></canvas>
        <div class="playhead"></div>
        <div class="beat-strip"><span>1</span><span>2</span><span>3</span><span>4</span></div>
        <div class="play-pill">▶</div>
      </button>
      <div class="card-foot">
        <div class="meta"><span class="bars">4 BEATS</span><span class="uses">0 USES</span></div>
        <div class="actions">
          <button class="icon-action drag-action" title="MIDIを書き出し">↗</button>
          <button class="copy-action">COPY</button>
        </div>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
